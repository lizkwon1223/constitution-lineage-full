<title id="title">초고 제외 · 선행 문헌과 제헌헌법의 장별 대응</title>
<desc id="desc">제헌헌법 103조. 초고를 후보에서 제외한 1위 대응을 문헌별·장별로 합산. 띠의 폭은 조문 수.</desc>
